number:
  - platform: template
    name: "Stage 2 Delay"
    id: stage2_delay_minutes
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 30
    initial_value: 5
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"
    mode: box
    web_server:
      sorting_group_id: group_climate
    on_value:
      - lambda: |-
          ESP_LOGI("config", "Stage 2 delay changed to %.0f minutes", x);

# Set compressor off/lockout time
  - platform: template
    name: "Min Compressor Off Time"
    id: min_compressor_off_minutes
    optimistic: true
    restore_value: true
    min_value: 2
    max_value: 10
    initial_value: 3
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-lock-outline"
    web_server:
      sorting_group_id: group_climate
    mode: box
    on_value:
      - lambda: |-
          ESP_LOGI("config", "Min compressor off time changed to %.0f minutes", x);

# Boot lockout if HVAC cycle was interrupted by reboot
# This prevents rapid on/off cycling if the thermostat reboots mid-cycle
  - platform: template
    name: "Interrupted Cycle Lockout"
    id: interrupted_cycle_lockout_minutes
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 10
    initial_value: 3
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:restart-alert"
    web_server:
      sorting_group_id: group_climate
    mode: box
    on_value:
      - lambda: |-
          ESP_LOGI("config", "Interrupted cycle lockout changed to %.0f minutes", x);

# Temperature grace period on boot
# How long to wait for API temperature before falling back to local sensor
# This allows time for network/switch link-up without blocking heating indefinitely
  - platform: template
    name: "Boot Temp Grace Period"
    id: boot_temp_grace_period_seconds
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 120
    initial_value: 45
    step: 5
    unit_of_measurement: "s"
    icon: "mdi:clock-start"
    web_server:
      sorting_group_id: group_climate
    mode: box
    on_value:
      - lambda: |-
          ESP_LOGI("config", "Boot temp grace period changed to %.0f seconds", x);

# Set filter runtime hours before alerting
  - platform: template
    name: "Filter Runtime Threshold"
    id: filter_change_threshold
    optimistic: true
    restore_value: true
    min_value: 100
    max_value: 500
    initial_value: 180
    step: 10
    unit_of_measurement: "hours"
    icon: "mdi:air-filter"
    web_server:
      sorting_group_id: group_runtimes
    mode: box

# COMPRESSOR minimum running time
# TODO: note for future updates add a dedicated compressor control output
  - platform: template
    name: "Min Compressor Run Time (unused)"
    id: min_compressor_run_minutes
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 10
    initial_value: 5
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-play-outline"
    web_server:
      sorting_group_id: group_climate
    mode: box

# Thermostat deadband and overrun settings
# Deadband: how far past setpoint before action STARTS
# Overrun: how far past setpoint before action STOPS

  - platform: template
    name: "Heat Deadband"
    id: heat_deadband_input
    optimistic: true
    restore_value: true
    min_value: 0.1
    max_value: 2.0
    initial_value: ${heat_deadband}
    step: 0.1
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-low"
    web_server:
      sorting_group_id: group_climate
    mode: box
    on_value:
      then:
        - lambda: |-
            ESP_LOGW("config", "Heat deadband on_value triggered with x=%.2f", x);
            float before = id(smart_thermostat).heat_deadband();
            ESP_LOGW("config", "Heat deadband BEFORE set: %.2f°C", before);
            id(smart_thermostat).set_heat_deadband(x);
            float after = id(smart_thermostat).heat_deadband();
            ESP_LOGW("config", "Heat deadband AFTER set: %.2f°C", after);
            id(smart_thermostat).publish_state();
            ESP_LOGI("config", "Heat deadband updated to: %.1f°C", x);

  - platform: template
    name: "Heat Overrun"
    id: heat_overrun_input
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 2.0
    initial_value: ${heat_overrun}
    step: 0.1
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-high"
    web_server:
      sorting_group_id: group_climate
    mode: box
    on_value:
      then:
        - lambda: |-
            ESP_LOGW("config", "Heat overrun on_value triggered with x=%.2f", x);
            float before = id(smart_thermostat).heat_overrun();
            ESP_LOGW("config", "Heat overrun BEFORE set: %.2f°C", before);
            id(smart_thermostat).set_heat_overrun(x);
            float after = id(smart_thermostat).heat_overrun();
            ESP_LOGW("config", "Heat overrun AFTER set: %.2f°C", after);
            id(smart_thermostat).publish_state();
            ESP_LOGI("config", "Heat overrun updated to: %.1f°C", x);

  - platform: template

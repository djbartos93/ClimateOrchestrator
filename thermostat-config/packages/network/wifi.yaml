# WiFi Network Configuration
wifi:
  networks:
  - ssid: ${wifi_ssid}
    password: ${wifi_password}
  - ssid: ${wifi_fallback_ssid}
    password: ${wifi_fallback_password}
  domain: ${wifi_domain}
  ap:
    ssid: "${friendly_name} Fallback"
    password: "thermostat"
  reboot_timeout: 0min
  power_save_mode: none
  on_connect:
    then:
      - rtttl.play: "wifi:d=8,o=6,b=200:g,g"
      - lambda: |-
          ESP_LOGI("network", "WiFi connection established");

captive_portal:

# WiFi Signal Strength - only available when using WiFi
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    web_server:
      sorting_group_id: group_runtimes
    update_interval: 60s

# WiFi Info - only available when using WiFi
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
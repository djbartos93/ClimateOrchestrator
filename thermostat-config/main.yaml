# ESPHome Smart Thermostat Configuration
substitutions:

#########################
# MODIFICATIONS ALLOWED #
#########################
  device_name: smart-thermostat
  friendly_name: "Smart Thermostat"

  # GitHub Branch for Package Loading
  # Change this to test different branches without modifying package includes
  # Options: main, feature/stage2-phase2-preset-urgency, or any branch name
  github_ref: &github_ref main

  # Network Configuration
  # To switch between WiFi and Ethernet, comment/uncomment the appropriate section around line 105

  # WiFi Settings
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_fallback_ssid: !secret iot_wifi
  wifi_fallback_password: !secret iot_password
  domain: !secret esp_domain

  ota_pass: !secret ota_password
  api_key: !secret api_encryption_key

  # Logging Configuration
  # Available levels: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE
  log_level_default: "DEBUG"
  log_level_climate: "DEBUG"
  log_level_dht: "INFO"
  log_level_sensor: "INFO"
  log_level_humidifier: "INFO"
  log_level_light: "INFO"

  # Syslog Configuration
  # To enable syslog logging, uncomment the 'udp:' and 'syslog:' sections around line 137
  # Set syslog_server to your syslog server IP address
  syslog_server: "192.168.1.100"

  # Home Assistant Sensor Entity IDs
  # Update these to match your outdoor weather sensor entity IDs
  outdoor_temp_entity: "sensor.lansing_st_weather_temp"
  outdoor_humidity_entity: "sensor.lansing_st_weather_humidity"

  # Remote Sensor Timeout (in seconds)
  # After this time with no updates, system will failover to alternate temperature sensors
  remote_temp_timeout: "300"
  remote_humidity_timeout: "300"

  # HVAC Feature Flags
  # To DISABLE Stage 2 Heating:
  #   Search for "# STAGE 2:" comments throughout this file
  #   Comment out all lines marked with "# STAGE 2:" (8 sections total)
  #   Sections: relay switch, maintenance switch, 2 safety interlocks, heat action,
  #             idle action, fan_only action, emergency stop

  # GPIO Pin Assignments - only change if you're using custom hardware
  pin_dht22: GPIO0

####################################
# DO NOT MODIFY BELOW THIS COMMENT #
####################################

# Last build number / device
  config_version: "0.3.8 - MBP Build"

# Timing Constants (all in seconds)
# sensable defaults are in place
  heat_stage2_delay: "300"  
  compressor_min_off: "180"  
  compressor_min_runtime: "300"  
  min_fan_runtime: "60"  
  max_heat_runtime: "7200"  # 2 hours
  max_cool_runtime: "7200"  # 2 hours

# Temperature Settings
  default_heat_setpoint: "22.22"  # 72°F
  default_cool_setpoint: "24.0"  # 75°F

  # Deadband: how far BELOW setpoint before heating starts / ABOVE setpoint before cooling starts
  # Overrun: how far ABOVE setpoint before heating stops / BELOW setpoint before cooling stops
  heat_deadband: "0.13"
  heat_overrun: "0.27"
  cool_deadband: "0.5"
  cool_overrun: "0.5"



esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: heat_stage1_relay
      - switch.turn_off: heat_stage2_relay
      - switch.turn_off: cool_relay
      - switch.turn_off: fan_relay
      - switch.turn_off: humidifier_relay
      - lambda: |-
          ESP_LOGI("boot", "Smart Thermostat booting...");
          // Record boot time for grace period calculations
          id(boot_time) = millis();
          // API readiness flag is driven by the API status sensor
          id(api_ready) = false;
          // Reset boot bypass on every boot
          id(boot_bypass_requested) = false;
          // Track boot lockout timing for diagnostics
          id(boot_lockout_start_ms) = millis();
          // Emergency timeout start (prevents freeze if HA never comes up)
          id(boot_lockout_emergency_end_ms) = id(boot_lockout_start_ms) + (10UL * 60UL * 1000UL);
          // Initialize remote timestamps to boot time - gives API a fair chance during grace period
          // Instead of starting at 0 (which would immediately mark them as stale)
          id(last_remote_temp_update) = millis();
          id(last_remote_humidity_update) = millis();
          // Temperature grace period is active until API sends first temp or timeout
          id(temp_grace_period_active) = true;
          ESP_LOGI("boot", "Runtime counters restored from flash");
      - rtttl.play: "boot:d=16,o=5,b=160:c,e,g" # Quick ascending chirp
      # Check if HVAC cycle was interrupted by previous shutdown/reboot
      - lambda: |-
          bool heating_interrupted = id(was_heating_on_shutdown);
          bool cooling_interrupted = id(was_cooling_on_shutdown);

          if (heating_interrupted || cooling_interrupted) {
            ESP_LOGW("boot", "INTERRUPTED CYCLE DETECTED - %s was running on shutdown",
                     heating_interrupted ? "HEATING" : "COOLING");
            ESP_LOGW("boot", "Extended boot lockout will be applied (%.0f minutes)",
                     id(interrupted_cycle_lockout_minutes).state);
          } else {
            ESP_LOGI("boot", "No interrupted cycle detected - normal boot lockout");
          }

          // Determine minimum lockout time for this boot
          float cfg_min = id(interrupted_cycle_lockout_minutes).state;
          float eff_min = cfg_min;
          if (heating_interrupted || cooling_interrupted) {
            if (eff_min < 5.0f) eff_min = 5.0f;
          } else {
            eff_min = 1.0f;  // Normal boot minimum lockout (60s)
          }
          id(boot_lockout_min_end_ms) = id(boot_lockout_start_ms) + (unsigned long)(eff_min * 60.0f * 1000.0f);

          ESP_LOGW("safety", "Boot lockout minimum: %.0f minutes (min_end in %.0f sec)",
                   eff_min,
                   (id(boot_lockout_min_end_ms) > millis()) ? (id(boot_lockout_min_end_ms) - millis()) / 1000.0f : 0.0f);
          ESP_LOGI("boot", "Hardware initialized - entering boot lockout");
      # Minimum lockout window (interruptible via boot bypass)
      - lambda: |-
          ESP_LOGI("safety", "Boot lockout minimum window active");
      - wait_until:
          timeout: !lambda |-
            long remaining = (long)id(boot_lockout_min_end_ms) - (long)millis();
            return (remaining > 0) ? (unsigned long)remaining : 0UL;
          condition:
            lambda: 'return id(boot_bypass_requested);'
      - if:
          condition:
            lambda: 'return id(boot_bypass_requested);'
          then:
            - lambda: |-
                ESP_LOGW("safety", "Boot lockout minimum window bypassed by operator");
          else:
            - lambda: |-
                ESP_LOGI("safety", "Boot lockout minimum window complete");

      - lambda: |-
          // Clear interrupted-cycle flags once the minimum lockout has been served (or bypassed)
          if (id(was_heating_on_shutdown) || id(was_cooling_on_shutdown)) {
            id(was_heating_on_shutdown) = false;
            id(was_cooling_on_shutdown) = false;
            ESP_LOGI("safety", "Interrupted-cycle flags cleared after minimum lockout phase");
          }
      # Wait for Home Assistant API to come online before allowing HVAC to run.
      # Emergency timeout prevents freeze if HA never comes up.
      - lambda: |-
          ESP_LOGI("safety", "Waiting for API before releasing boot_lockout (emergency timeout 10min)");
      - wait_until:
          timeout: !lambda |-
            long remaining = (long)id(boot_lockout_emergency_end_ms) - (long)millis();
            return (remaining > 0) ? (unsigned long)remaining : 0UL;
          condition:
            lambda: 'return id(api_ready) || id(boot_bypass_requested);'
      - lambda: |-
          if (id(boot_bypass_requested)) {
            id(boot_lockout) = false;
            ESP_LOGW("safety", "Boot lockout released via operator bypass");
          } else if (id(api_ready)) {
            id(boot_lockout) = false;
            ESP_LOGI("safety", "Boot lockout released - API connected");
          } else {
            id(boot_lockout) = false;
            ESP_LOGW("safety", "Boot lockout released via emergency timeout (API still offline)");
          }
      # End temperature grace period after configured time if still active
      - delay: !lambda "return id(boot_temp_grace_period_seconds).state * 1000;"
      - lambda: |-
          if (id(temp_grace_period_active)) {
            id(temp_grace_period_active) = false;
            ESP_LOGI("boot", "Temperature grace period ended - using available sensors");
          }
#Hardware setup, only change if using different/custom hardware
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_LWIP_SOCKET_OFFSET: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
    
psram:
  mode: octal
  speed: 80MHz


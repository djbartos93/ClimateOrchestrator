# Main Climate Control Dashboard
# Primary dashboard for daily thermostat operation with Material You theme
# Uses sections layout with built-in cards and minimal Bubble Card usage

title: Climate Control
icon: mdi:home-thermometer
path: climate-control
type: sections
max_columns: 3
sections:

  # ========================================================================
  # SECTION 1: Main Temperature Control
  # ========================================================================
  - type: grid
    title: Temperature Control
    cards:
      - type: thermostat
        entity: climate.smart_thermostat
        name: Smart Thermostat
        features:
          - type: target-temperature
          - type: hvac-modes
          - type: preset-modes

      - type: entities
        title: Current Conditions
        entities:
          - entity: sensor.thermostat_average_temperature
            name: Average Indoor Temp
            icon: mdi:home-thermometer
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor Temperature
            icon: mdi:weather-rainy
          - entity: sensor.thermostat_average_humidity
            name: Indoor Humidity
            icon: mdi:water-percent
          - entity: sensor.humidifier_effective_setpoint
            name: Humidity Target
            icon: mdi:target

      - type: gauge
        entity: sensor.thermostat_average_temperature
        name: Indoor Temperature
        min: 15
        max: 30
        needle: true
        severity:
          green: 20
          yellow: 22
          red: 25

  # ========================================================================
  # SECTION 2: System Status & Active Equipment
  # ========================================================================
  - type: grid
    title: System Status
    cards:
      - type: entities
        title: HVAC Status
        entities:
          - entity: binary_sensor.smart_thermostat_heating_active
            name: 🔥 Heating Active
          - entity: binary_sensor.smart_thermostat_stage_2_active
            name: 🔥🔥 Stage 2 Active
          - entity: binary_sensor.smart_thermostat_cooling_active
            name: ❄️ Cooling Active
          - entity: switch.smart_thermostat_fan_relay
            name: 🌀 Fan Active
          - entity: switch.smart_thermostat_humidifier_relay
            name: 💧 Humidifier Active

      - type: entities
        title: Control Mode
        entities:
          - entity: switch.smart_thermostat_ecobee_passthrough_mode
            name: Ecobee Passthrough
          - entity: sensor.thermostat_ecobee_passthrough_status
            name: Control Status
          - entity: sensor.thermostat_system_mismatch_status
            name: System Sync Status
          - entity: binary_sensor.thermostat_system_mismatch_detected
            name: ⚠️ Mismatch Detected

      - type: button
        entity: button.smart_thermostat_emergency_stop
        name: 🚨 Emergency Stop
        icon: mdi:alert-octagon
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.smart_thermostat_emergency_stop

  # ========================================================================
  # SECTION 3: Quick Actions & Presets
  # ========================================================================
  - type: grid
    title: Quick Actions
    cards:
      - type: entities
        title: Mode Selection
        entities:
          - entity: input_select.house_mode
            name: House Mode
          - entity: climate.smart_thermostat
            attribute: preset_mode
            name: Thermostat Preset

      - type: entities
        title: Quick Setpoints
        entities:
          - entity: input_number.humidifier_manual_setpoint
            name: Manual Humidity Target
          - entity: input_boolean.humidifier_manual_setpoint
            name: Override Auto Humidity
          - entity: input_boolean.ecobee_passthrough_on_vacation
            name: Auto Ecobee on Vacation

      - type: entities
        title: Maintenance Controls
        entities:
          - entity: switch.smart_thermostat_maintenance_mode
            name: Maintenance Mode
          - entity: button.smart_thermostat_reboot
            name: Reboot Thermostat
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.smart_thermostat_reboot

  # ========================================================================
  # SECTION 4: Room Sensor Status
  # ========================================================================
  - type: grid
    title: Room Sensors
    cards:
      - type: entities
        title: Temperature Sensors
        entities:
          - entity: input_boolean.thermostat_use_living_room_temp
            name: 🛋️ Living Room
          - entity: input_boolean.thermostat_use_bedroom_temp
            name: 🛏️ Bedroom
          - entity: input_boolean.thermostat_use_kitchen_temp
            name: 🍳 Kitchen
          - entity: input_boolean.thermostat_use_office_temp
            name: 🪑 Office
          - entity: sensor.active_temperature_sensor_config
            name: Active Configuration

      - type: entities
        title: Humidity Sensors
        entities:
          - entity: input_boolean.thermostat_use_living_room_humidity
            name: 🛋️ Living Room
          - entity: input_boolean.thermostat_use_bedroom_humidity
            name: 🛏️ Bedroom
          - entity: input_boolean.thermostat_use_kitchen_humidity
            name: 🍳 Kitchen
          - entity: input_boolean.thermostat_use_office_humidity
            name: 🪑 Office

      - type: sensor
        entity: sensor.smart_thermostat_local_temperature
        name: Local Thermostat Sensor
        graph: line
        detail: 2
        hours_to_show: 2

  # ========================================================================
  # SECTION 5: Today's Performance
  # ========================================================================
  - type: grid
    title: Today's Performance
    cards:
      - type: entities
        title: Runtime Statistics
        entities:
          - entity: sensor.heating_runtime_today
            name: Heating Runtime
            icon: mdi:fire
          - entity: sensor.cooling_runtime_today
            name: Cooling Runtime
            icon: mdi:snowflake
          - entity: sensor.humidifier_runtime_today
            name: Humidifier Runtime
            icon: mdi:air-humidifier
          - entity: sensor.smart_thermostat_control_time_today
            name: Smart Control Time
            icon: mdi:brain
          - entity: sensor.ecobee_control_time_today
            name: Ecobee Control Time
            icon: mdi:transit-connection-variant

      - type: entities
        title: Cycle Counters
        entities:
          - entity: counter.thermostat_heating_cycles_today
            name: Heating Cycles
            icon: mdi:fire
          - entity: counter.thermostat_cooling_cycles_today
            name: Cooling Cycles
            icon: mdi:snowflake
          - entity: counter.humidifier_runtime_minutes
            name: Humidifier Minutes
            icon: mdi:air-humidifier

      - type: gauge
        entity: sensor.heating_efficiency_score
        name: Heating Efficiency
        min: 0
        max: 100
        needle: true
        severity:
          green: 80
          yellow: 60
          red: 40

  # ========================================================================
  # SECTION 6: Weather & Environmental Context
  # ========================================================================
  - type: grid
    title: Environmental Context
    cards:
      - type: entities
        title: Weather Conditions
        entities:
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor Temperature
          - entity: sensor.humidifier_auto_setpoint
            name: Auto Humidity Target
          - entity: sensor.current_heat_loss_rate
            name: Current Heat Loss Rate
          - entity: sensor.outdoor_temperature_avg_week
            name: Weekly Outdoor Avg

      - type: sensor
        entity: sensor.smart_thermostat_outdoor_temperature
        name: Outdoor Temperature Trend
        graph: line
        detail: 2
        hours_to_show: 24

      - type: history-graph
        title: Temperature History
        hours_to_show: 24
        entities:
          - entity: sensor.thermostat_average_temperature
            name: Indoor Avg
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor
          - entity: sensor.smart_thermostat_local_temperature
            name: Local Sensor

# Climate Orchestrator Unified Dashboard
# Single dashboard with tabbed views for all thermostat functions
# Uses Material You theme with built-in cards and minimal Bubble Card usage

title: Climate Orchestrator
icon: mdi:home-thermometer
path: climate-orchestrator
type: sections
max_columns: 3
sections:

  # ========================================================================
  # TAB 1: Climate Control (Main Operations)
  # ========================================================================
  - type: grid
    title: Climate Control
    cards:
      # Main Temperature Control
      - type: thermostat
        entity: climate.smart_thermostat
        name: Smart Thermostat
        features:
          - type: target-temperature
          - type: hvac-modes
          - type: preset-modes

      # Current Conditions
      - type: entities
        title: Current Conditions
        entities:
          - entity: sensor.thermostat_average_temperature
            name: Average Indoor Temp
            icon: mdi:home-thermometer
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor Temperature
            icon: mdi:weather-rainy
          - entity: sensor.thermostat_average_humidity
            name: Indoor Humidity
            icon: mdi:water-percent
          - entity: sensor.humidifier_effective_setpoint
            name: Humidity Target
            icon: mdi:target

      # Temperature Gauge
      - type: gauge
        entity: sensor.thermostat_average_temperature
        name: Indoor Temperature
        min: 15
        max: 30
        needle: true
        severity:
          green: 20
          yellow: 22
          red: 25

      # System Status
      - type: entities
        title: HVAC Status
        entities:
          - entity: binary_sensor.smart_thermostat_heating_active
            name: 🔥 Heating Active
          - entity: binary_sensor.smart_thermostat_stage_2_active
            name: 🔥🔥 Stage 2 Active
          - entity: binary_sensor.smart_thermostat_cooling_active
            name: ❄️ Cooling Active
          - entity: switch.smart_thermostat_fan_relay
            name: 🌀 Fan Active
          - entity: switch.smart_thermostat_humidifier_relay
            name: 💧 Humidifier Active

      # Quick Actions
      - type: entities
        title: Quick Actions
        entities:
          - entity: input_select.house_mode
            name: House Mode
          - entity: climate.smart_thermostat
            attribute: preset_mode
            name: Thermostat Preset
          - entity: switch.smart_thermostat_ecobee_passthrough_mode
            name: Ecobee Passthrough
          - entity: button.smart_thermostat_emergency_stop
            name: 🚨 Emergency Stop
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.smart_thermostat_emergency_stop

      # Today's Performance
      - type: entities
        title: Today's Performance
        entities:
          - entity: sensor.heating_runtime_today
            name: Heating Runtime
            icon: mdi:fire
          - entity: sensor.cooling_runtime_today
            name: Cooling Runtime
            icon: mdi:snowflake
          - entity: counter.thermostat_heating_cycles_today
            name: Heating Cycles
            icon: mdi:fire
          - entity: sensor.heating_efficiency_score
            name: Efficiency Score
            icon: mdi:gauge

  # ========================================================================
  # TAB 2: Configuration
  # ========================================================================
  - type: grid
    title: Configuration
    cards:
      # Sensor Selection
      - type: entities
        title: Temperature Sensor Selection
        entities:
          - entity: input_boolean.thermostat_use_living_room_temp
            name: 🛋️ Living Room
          - entity: input_boolean.thermostat_use_bedroom_temp
            name: 🛏️ Bedroom
          - entity: input_boolean.thermostat_use_kitchen_temp
            name: 🍳 Kitchen
          - entity: input_boolean.thermostat_use_office_temp
            name: 🪑 Office
          - entity: sensor.active_temperature_sensor_config
            name: Active Configuration

      # Humidity Sensor Selection
      - type: entities
        title: Humidity Sensor Selection
        entities:
          - entity: input_boolean.thermostat_use_living_room_humidity
            name: 🛋️ Living Room
          - entity: input_boolean.thermostat_use_bedroom_humidity
            name: 🛏️ Bedroom
          - entity: input_boolean.thermostat_use_kitchen_humidity
            name: 🍳 Kitchen
          - entity: input_boolean.thermostat_use_office_humidity
            name: 🪑 Office

      # Humidifier Settings
      - type: entities
        title: Humidifier Settings
        entities:
          - entity: input_boolean.humidifier_manual_setpoint
            name: Manual Override Mode
          - entity: input_number.humidifier_manual_setpoint
            name: Manual Target (%)
          - entity: sensor.humidifier_effective_setpoint
            name: Active Target (%)
          - entity: sensor.humidifier_auto_setpoint
            name: Auto Target (%)

      # House Configuration
      - type: entities
        title: House Configuration
        entities:
          - entity: input_number.thermostat_house_square_feet
            name: House Size (sqft)
          - entity: input_number.thermostat_house_year_built
            name: Year Built
          - entity: sensor.recommended_target_cycle_time
            name: Recommended Cycle Time
          - entity: input_number.thermostat_target_cycle_time
            name: Target Cycle Time (min)

      # System Behavior
      - type: entities
        title: System Behavior
        entities:
          - entity: input_boolean.ecobee_passthrough_on_vacation
            name: Auto Ecobee on Vacation
          - entity: switch.smart_thermostat_maintenance_mode
            name: Maintenance Mode
          - entity: binary_sensor.everyone_away
            name: Everyone Away
          - entity: button.smart_thermostat_reboot
            name: Reboot Device
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.smart_thermostat_reboot

      # Thermal Model Settings
      - type: entities
        title: Thermal Model Settings
        entities:
          - entity: input_number.thermostat_thermal_mass
            name: House Thermal Mass (τ)
          - entity: sensor.thermal_model_status
            name: Model Status
          - entity: counter.thermostat_cycles_analyzed
            name: Cycles Analyzed
          - entity: input_datetime.thermostat_last_model_update
            name: Last Model Update

  # ========================================================================
  # TAB 3: Monitoring & Analytics
  # ========================================================================
  - type: grid
    title: Monitoring & Analytics
    cards:
      # Thermal Model Status
      - type: entities
        title: Thermal Model Learning
        entities:
          - entity: sensor.thermal_model_status
            name: Current Status
          - entity: sensor.active_preset_mode
            name: Active Preset
          - entity: counter.thermostat_cycles_analyzed
            name: Cycles Analyzed
          - entity: input_datetime.thermostat_last_model_update
            name: Last Update
          - entity: binary_sensor.sensor_configuration_changed
            name: ⚠️ Config Changed

      # Model Confidence Gauge
      - type: gauge
        entity: input_number.thermostat_model_confidence_home
        name: Model Confidence
        min: 0
        max: 100
        needle: true
        severity:
          green: 80
          yellow: 60
          red: 40

      # Predictions
      - type: entities
        title: Thermal Predictions
        entities:
          - entity: sensor.predicted_time_to_setpoint_stage_1
            name: Stage 1 Only (min)
          - entity: sensor.predicted_time_to_setpoint_stage_1_2
            name: Stage 1+2 (min)
          - entity: sensor.optimal_stage_2_delay
            name: Optimal Stage 2 Delay
          - entity: sensor.current_heat_loss_rate
            name: Current Heat Loss

      # Efficiency Metrics
      - type: gauge
        entity: sensor.heating_efficiency_score
        name: Heating Efficiency Score
        min: 0
        max: 100
        needle: true
        severity:
          green: 80
          yellow: 60
          red: 40

      # Weekly Performance
      - type: entities
        title: Weekly Performance
        entities:
          - entity: sensor.heating_runtime_this_week
            name: Weekly Heating
          - entity: sensor.heating_cycles_this_week
            name: Weekly Heating Cycles
          - entity: sensor.stage_2_runtime_this_week
            name: Stage 2 Runtime
          - entity: sensor.outdoor_temperature_avg_week
            name: Weekly Outdoor Avg

      # Temperature Trends
      - type: history-graph
        title: Temperature Trends (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.thermostat_average_temperature
            name: Indoor Average
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor
          - entity: state_attr('climate.smart_thermostat', 'temperature')
            name: Setpoint

      # HVAC Activity
      - type: history-graph
        title: HVAC Activity (24h)
        hours_to_show: 24
        entities:
          - entity: binary_sensor.smart_thermostat_heating_active
            name: Heating
          - entity: binary_sensor.smart_thermostat_stage_2_active
            name: Stage 2
          - entity: binary_sensor.smart_thermostat_cooling_active
            name: Cooling
          - entity: switch.smart_thermostat_humidifier_relay
            name: Humidifier

  # ========================================================================
  # TAB 4: System Diagnostics
  # ========================================================================
  - type: grid
    title: System Diagnostics
    cards:
      # System Health
      - type: entities
        title: System Health
        entities:
          - entity: binary_sensor.smart_thermostat_api_connected
            name: API Connected
          - entity: sensor.smart_thermostat_uptime
            name: Device Uptime
          - entity: sensor.smart_thermostat_wifi_signal
            name: WiFi Signal Strength
          - entity: switch.smart_thermostat_maintenance_mode
            name: Maintenance Mode

      # Safety Systems
      - type: entities
        title: Safety Interlocks
        entities:
          - entity: binary_sensor.smart_thermostat_boot_lockout_active
            name: 🚫 Boot Lockout
          - entity: binary_sensor.smart_thermostat_heat_cool_interlock
            name: 🚫 Heat/Cool Interlock
          - entity: binary_sensor.smart_thermostat_compressor_protection
            name: 🚫 Compressor Protection
          - entity: binary_sensor.smart_thermostat_runtime_limit
            name: 🚫 Runtime Limit

      # Hardware Status
      - type: entities
        title: Hardware Status
        entities:
          - entity: switch.smart_thermostat_heat_relay
            name: Heat Relay
          - entity: switch.smart_thermostat_stage_2_relay
            name: Stage 2 Relay
          - entity: switch.smart_thermostat_cool_relay
            name: Cool Relay
          - entity: switch.smart_thermostat_fan_relay
            name: Fan Relay
          - entity: switch.smart_thermostat_humidifier_relay
            name: Humidifier Relay

      # Sensor Diagnostics
      - type: entities
        title: Sensor Diagnostics
        entities:
          - entity: sensor.smart_thermostat_local_temperature
            name: Local Sensor Temp
          - entity: sensor.smart_thermostat_local_humidity
            name: Local Sensor Humidity
          - entity: binary_sensor.smart_thermostat_dht22_error
            name: ⚠️ DHT22 Error
          - entity: sensor.smart_thermostat_free_memory
            name: Free Memory

      # System Mismatch
      - type: entities
        title: System Mismatch Detection
        entities:
          - entity: sensor.thermostat_system_mismatch_status
            name: Mismatch Status
          - entity: binary_sensor.thermostat_system_mismatch_detected
            name: ⚠️ Mismatch Detected
          - entity: switch.smart_thermostat_ecobee_passthrough_mode
            name: Passthrough Mode
          - entity: sensor.thermostat_ecobee_passthrough_status
            name: Control Status

      # Troubleshooting
      - type: entities
        title: Troubleshooting Indicators
        entities:
          - entity: binary_sensor.losing_ground_while_heating
            name: ⚠️ Losing Ground
          - entity: binary_sensor.stage2_should_engage
            name: Stage 2 Should Engage
          - entity: binary_sensor.stage2_near_setpoint_inhibit
            name: Stage 2 Near Setpoint
          - entity: binary_sensor.stage2_large_delta_trigger
            name: Stage 2 Large Delta

      # Performance Metrics
      - type: sensor
        entity: sensor.smart_thermostat_uptime
        name: Device Uptime
        graph: line
        detail: 2
        hours_to_show: 24

      # WiFi Signal
      - type: sensor
        entity: sensor.smart_thermostat_wifi_signal
        name: WiFi Signal Strength
        graph: line
        detail: 2
        hours_to_show: 24

  # ========================================================================
  # TAB 5: Advanced Thermal Model
  # ========================================================================
  - type: grid
    title: Advanced Thermal Model
    cards:
      # Current Heating Cycle
      - type: entities
        title: Current Heating Cycle
        entities:
          - entity: binary_sensor.smart_thermostat_heating_active
            name: Heating Active
          - entity: binary_sensor.smart_thermostat_stage_2_active
            name: Stage 2 Active
          - entity: sensor.current_temperature_delta
            name: Temperature to Go
          - entity: sensor.heating_cycle_progress
            name: Temperature Gain This Cycle
          - entity: binary_sensor.losing_ground_while_heating
            name: ⚠️ Losing Ground Alert

      # Temperature Delta Gauge
      - type: gauge
        entity: sensor.current_temperature_delta
        name: Distance from Setpoint
        min: 0
        max: 10
        needle: true
        severity:
          green: 0
          yellow: 1.5
          red: 3

      # Stage 2 Control
      - type: entities
        title: Stage 2 Intelligent Control
        entities:
          - entity: number.smart_thermostat_stage_2_delay
            name: Current Delay Setting
          - entity: sensor.optimal_stage_2_delay
            name: Recommended Optimal Delay
          - entity: binary_sensor.stage2_should_engage
            name: ✅ Should Engage (Master)
          - entity: binary_sensor.stage2_temporarily_disabled
            name: Stage 2 Disabled?

      # Stage 2 Triggers
      - type: entities
        title: Stage 2 Triggers & Inhibits
        entities:
          - entity: binary_sensor.stage2_near_setpoint_inhibit
            name: Near-Setpoint Inhibit (1.5°F)
          - entity: binary_sensor.stage2_large_delta_trigger
            name: Large Delta Trigger (>3°F)
          - entity: sensor.time_since_setpoint_change
            name: Time Since Setpoint Changed
          - entity: sensor.time_since_preset_change
            name: Time Since Preset Changed

      # All Presets Comparison
      - type: entities
        title: All Presets Learning Summary
        entities:
          - entity: input_number.thermostat_heat_loss_coefficient_home
            name: Heat Loss - Home
          - entity: input_number.thermostat_stage1_heating_rate_home
            name: Stage 1 Rate - Home
          - entity: input_number.thermostat_heat_loss_coefficient_away
            name: Heat Loss - Away
          - entity: input_number.thermostat_stage1_heating_rate_away
            name: Stage 1 Rate - Away
          - entity: input_number.thermostat_heat_loss_coefficient_sleep
            name: Heat Loss - Sleep
          - entity: input_number.thermostat_stage1_heating_rate_sleep
            name: Stage 1 Rate - Sleep
          - entity: input_number.thermostat_heat_loss_coefficient_boost
            name: Heat Loss - Boost
          - entity: input_number.thermostat_stage1_heating_rate_boost
            name: Stage 1 Rate - Boost

      # Rate of Change Analysis
      - type: entities
        title: Rate of Change Diagnostics
        entities:
          - entity: sensor.temperature_change_rate_5min
            name: 5-Min Rate
          - entity: sensor.temperature_change_rate_10min
            name: 10-Min Rate
          - entity: binary_sensor.losing_ground_while_heating
            name: ⚠️ Losing Ground
          - entity: sensor.heating_cycle_progress
            name: Cycle Progress

      # Temperature Trend
      - type: sensor
        entity: sensor.thermostat_average_temperature
        name: Temperature Trend (4h)
        graph: line
        detail: 2
        hours_to_show: 4

      # Heat Loss Trend
      - type: sensor
        entity: sensor.current_heat_loss_rate
        name: Heat Loss Rate Trend (4h)
        graph: line
        detail: 2
        hours_to_show: 4

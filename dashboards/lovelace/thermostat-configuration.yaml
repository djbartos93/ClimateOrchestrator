# Configuration Dashboard
# Dashboard for configuring thermostat settings, sensors, and preferences
# Uses sections layout with Material You theme and built-in cards

title: Thermostat Configuration
icon: mdi:cog
path: thermostat-config
type: sections
max_columns: 3
sections:

  # ========================================================================
  # SECTION 1: Sensor Configuration
  # ========================================================================
  - type: grid
    title: Temperature Sensor Selection
    cards:
      - type: entities
        title: Enable Room Temperature Sensors
        entities:
          - entity: input_boolean.thermostat_use_living_room_temp
            name: 🛋️ Living Room Temperature
          - entity: input_boolean.thermostat_use_bedroom_temp
            name: 🛏️ Bedroom Temperature
          - entity: input_boolean.thermostat_use_kitchen_temp
            name: 🍳 Kitchen Temperature
          - entity: input_boolean.thermostat_use_office_temp
            name: 🪑 Office Temperature
          - entity: sensor.active_temperature_sensor_config
            name: Current Active Sensors

      - type: entities
        title: Enable Room Humidity Sensors
        entities:
          - entity: input_boolean.thermostat_use_living_room_humidity
            name: 🛋️ Living Room Humidity
          - entity: input_boolean.thermostat_use_bedroom_humidity
            name: 🛏️ Bedroom Humidity
          - entity: input_boolean.thermostat_use_kitchen_humidity
            name: 🍳 Kitchen Humidity
          - entity: input_boolean.thermostat_use_office_humidity
            name: 🪑 Office Humidity

      - type: entities
        title: Sensor Status
        entities:
          - entity: sensor.thermostat_average_temperature
            name: Calculated Average Temp
          - entity: sensor.thermostat_average_humidity
            name: Calculated Average Humidity
          - entity: sensor.smart_thermostat_local_temperature
            name: Local Fallback Sensor
          - entity: sensor.smart_thermostat_local_humidity
            name: Local Humidity Sensor

  # ========================================================================
  # SECTION 2: Humidifier Configuration
  # ========================================================================
  - type: grid
    title: Humidifier Settings
    cards:
      - type: entities
        title: Humidity Control
        entities:
          - entity: input_boolean.humidifier_manual_setpoint
            name: Manual Override Mode
          - entity: input_number.humidifier_manual_setpoint
            name: Manual Target (%)
          - entity: sensor.humidifier_effective_setpoint
            name: Active Target (%)
          - entity: sensor.humidifier_auto_setpoint
            name: Auto Target (%)

      - type: gauge
        entity: sensor.humidifier_effective_setpoint
        name: Humidity Target
        min: 20
        max: 50
        needle: true
        severity:
          green: 35
          yellow: 40
          red: 45

      - type: entities
        title: Humidity Calculation
        entities:
          - entity: sensor.smart_thermostat_outdoor_temperature
            name: Outdoor Temperature
          - entity: sensor.smart_thermostat_outdoor_humidity
            name: Outdoor Humidity
          - entity: counter.humidifier_runtime_minutes
            name: Total Runtime (Minutes)

  # ========================================================================
  # SECTION 3: House Configuration
  # ========================================================================
  - type: grid
    title: House & System Configuration
    cards:
      - type: entities
        title: House Characteristics
        entities:
          - entity: input_number.thermostat_house_square_feet
            name: House Size (sqft)
          - entity: input_number.thermostat_house_year_built
            name: Year Built
          - entity: sensor.recommended_target_cycle_time
            name: Recommended Cycle Time
          - entity: input_number.thermostat_target_cycle_time
            name: Target Cycle Time (min)

      - type: entities
        title: Mode & Behavior
        entities:
          - entity: input_select.house_mode
            name: House Mode
          - entity: input_boolean.ecobee_passthrough_on_vacation
            name: Auto Ecobee on Vacation
          - entity: switch.smart_thermostat_maintenance_mode
            name: Maintenance Mode
          - entity: switch.smart_thermostat_ecobee_passthrough_mode
            name: Ecobee Passthrough

      - type: entities
        title: Occupancy Detection
        entities:
          - entity: binary_sensor.everyone_away
            name: Everyone Away
          - entity: person.eric_bartos
            name: Eric Status
          - entity: person.seama
            name: Seama Status

  # ========================================================================
  # SECTION 4: Thermal Model Parameters
  # ========================================================================
  - type: grid
    title: Thermal Model Configuration
    cards:
      - type: entities
        title: Global Parameters
        entities:
          - entity: input_number.thermostat_thermal_mass
            name: House Thermal Mass (τ)
          - entity: sensor.thermal_model_status
            name: Model Status
          - entity: counter.thermostat_cycles_analyzed
            name: Cycles Analyzed
          - entity: input_datetime.thermostat_last_model_update
            name: Last Model Update

      - type: entities
        title: Current Preset Parameters
        entities:
          - entity: sensor.active_preset_mode
            name: Active Preset
          - entity: input_number.thermostat_heat_loss_coefficient_home
            name: Heat Loss Coefficient
          - entity: input_number.thermostat_stage1_heating_rate_home
            name: Stage 1 Heating Rate
          - entity: input_number.thermostat_stage2_additional_rate_home
            name: Stage 2 Additional Rate
          - entity: input_number.thermostat_model_confidence_home
            name: Model Confidence

      - type: gauge
        entity: input_number.thermostat_model_confidence_home
        name: Learning Confidence
        min: 0
        max: 100
        needle: true
        severity:
          green: 80
          yellow: 60
          red: 40

  # ========================================================================
  # SECTION 5: Advanced Settings
  # ========================================================================
  - type: grid
    title: Advanced Configuration
    cards:
      - type: entities
        title: ESPHome Device Settings
        entities:
          - entity: number.smart_thermostat_stage_2_delay
            name: Stage 2 Delay (seconds)
          - entity: button.smart_thermostat_reboot
            name: Reboot Device
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.smart_thermostat_reboot
          - entity: button.smart_thermostat_emergency_stop
            name: Emergency Stop
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.smart_thermostat_emergency_stop

      - type: entities
        title: Learning System
        entities:
          - entity: input_text.thermostat_recent_cycles
            name: Recent Cycle Data
          - entity: input_text.thermostat_last_sensor_config_home
            name: Last Sensor Config - Home
          - entity: input_text.thermostat_last_sensor_config_away
            name: Last Sensor Config - Away
          - entity: input_text.thermostat_last_sensor_config_sleep
            name: Last Sensor Config - Sleep
          - entity: input_text.thermostat_last_sensor_config_boost
            name: Last Sensor Config - Boost

      - type: markdown
        title: Configuration Notes
        content: |
          ## Sensor Selection Tips
          - Enable multiple room sensors for better averaging
          - System falls back to local sensor if all remote sensors fail
          - Different presets can use different sensor combinations
          
          ## Thermal Model Learning
          - Model learns independently for each preset mode
          - Confidence increases with more heating cycles (20% → 95%)
          - Changing sensor configuration requires recalibration
          
          ## Safety Features
          - Emergency stop immediately shuts down all HVAC equipment
          - Maintenance mode bypasses automation for manual control
          - Ecobee passthrough allows fallback to existing thermostat
